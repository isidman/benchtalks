<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Benchtalks Status</title>
        <style>
            *{
                box-sizing: border-box;
                margin:0;
                padding:0;
            }

            body{
                font-family: monospace;
                background: #1a1a1a;
                color: #e0e0e0;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 2rem;
                gap: 1.5rem;
            }

            @media (prefers-color-scheme: light) {
                body{
                    background: #f0f0f0;
                    color:#1a1a1a;
                }
            }

            #indicator {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                background: #555;
            }

            #indicator.up {background: #4caf50;}
            #indicator.down {background: #f44336;}

            #fields {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }

            #chart {
                width: 300px;
                height: 80px;
            }

            hr {
                width: 300px;
                border: none;
                border-top: 1px solid #333;
            }
            
            a {
                color: #e0e0e0;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div id="indicator"></div>
        <div id="fields"></div>
        <svg id="chart"></svg>
        <hr>
        <p style="font-size: 0.8rem; opacity: 0.6;">
            <a href="/terms.html" style="color: white !important;">Terms of Service</a> • 
            <a href="/privacy.html" style="color: white !important;">Privacy Policy</a>
        </p>
        <p>Made with❤️ from <a href="https://eazyizzie.dev" target="_blank">Izzi3m</a>.</p>
        <script src="/assets/js/status.js"></script>
    </body>
</html>
